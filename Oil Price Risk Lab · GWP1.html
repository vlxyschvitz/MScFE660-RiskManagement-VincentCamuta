<script>
/* ============ DEFAULT VALUES (from the group notebook) ============ */
const CFG={start:'2000-01-01',end:'2026-10-14',win:11,k:8,gD:5,gW:2,gM:2};
let EV=[["2001-09-01","2001-10-31","9/11 attacks"],["2003-03-01","2003-04-30","Iraq war begins"],["2005-08-25","2005-10-31","Hurricanes Katrina / Rita"],["2008-06-01","2009-09-30","Oil peak / GFC (Lehman) and recovery"],["2010-05-01","2010-05-31","Flash crash / euro-area debt crisis"],["2011-02-01","2011-10-31","Arab Spring / Libya outage"],["2014-11-01","2016-03-15","OPEC declines to cut; collapse to 2016 trough"],["2015-08-15","2015-09-30","China devaluation / Aug-2015 flash crash"],["2017-08-25","2017-09-30","Hurricanes Harvey / Irma"],["2020-03-01","2020-06-30","COVID-19 shock / price war / negative WTI"],["2021-02-10","2021-02-28","Winter Storm Uri"],["2022-02-01","2022-07-31","Russia invades Ukraine"],["2026-02-01","2026-10-14","2026 oil spike / geopolitical-risk surge"]];
const ADJ=new Set(['XOM','COP','XLE']);
const REG=`WTI|Group|Target|FRED (EIA)|DCOILWTICO|USD/bbl|logret|West Texas Intermediate spot price, Cushing OK
Brent|Group|Target|FRED (EIA)|DCOILBRENTEU|USD/bbl|logret|Brent spot price, Europe
GEPU|A|Macro|FRED|GEPUCURRENT|Index|logret|Global Economic Policy Uncertainty index
GPR|A|Geopolitical|Caldara-Iacoviello|GPR|Index|logret|Geopolitical Risk index (news-based)
INDPRO|A|Macro|FRED|INDPRO|Index 2017=100|logret|US industrial production (demand proxy)
CPI|A|Macro|FRED|CPIAUCSL|Index 1982-84=100|logret|US consumer price index
UNRATE|A|Macro|FRED|UNRATE|%|diff|US unemployment rate
FEDFUNDS|A|Macro|FRED|FEDFUNDS|%|diff|Effective federal funds rate
USD_broad|A|Macro|FRED|DTWEXBGS|Index Jan2006=100|logret|Nominal broad trade-weighted USD index
BE10Y|A|Macro|FRED|T10YIE|%|diff|10-year breakeven inflation rate
US_prod|B|Micro|EIA|MCRFPUS2|kbbl/day|logret|US field production of crude oil
US_stocks|B|Micro|EIA|WCESTUS1|kbbl|logret|US commercial crude stocks excl. SPR (weekly)
Gasoline|B|Micro|FRED (EIA)|GASREGW|USD/gal|logret|US regular gasoline retail price (weekly)
VehSales|B|Micro|FRED|TOTALSA|Mil. units SAAR|logret|US total vehicle sales
XOM|B|Micro|Yahoo|XOM|USD|logret|Exxon Mobil dividend-adjusted close
COP|B|Micro|Yahoo|COP|USD|logret|ConocoPhillips dividend-adjusted close
SP500|C|Financial|Yahoo|^GSPC|Index|logret|S&P 500 index
VIX|C|Financial|Yahoo|^VIX|Index|logret|CBOE volatility index
Gold|C|Financial|Yahoo|GC=F|USD/oz|logret|COMEX gold futures (front month)
US10Y|C|Financial|Yahoo|^TNX|%|diff|10-year US Treasury yield
DXY|C|Financial|Yahoo|DX-Y.NYB|Index|logret|ICE US Dollar index
XLE|C|Financial|Yahoo|XLE|USD|logret|Energy Select Sector SPDR ETF
NatGas|C|Financial|Yahoo|NG=F|USD/MMBtu|logret|Henry Hub natural gas futures`.split('\n').map(l=>{const p=l.split('|');return{n:p[0],o:p[1],c:p[2],s:p[3],code:p[4],u:p[5],tf:p[6],d:p[7],on:true}});
const NB={WTI:{vol:.474,sk:-1.945,ku:72.97},SP500:{vol:.194,sk:-.357,ku:10.84}}; // notebook reference values
const S={raw:{},src:{},clean:{},log:[]};let TAB='problem',CH={};

/* ============ UTILS ============ */
const $=s=>document.querySelector(s),css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const f=(x,d=3)=>x==null||!isFinite(x)?'–':(+x).toFixed(d),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length,sd=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const mom=(a,k)=>{const m=mean(a),v=a.reduce((s,x)=>s+(x-m)**2,0)/a.length;return a.reduce((s,x)=>s+(x-m)**k,0)/a.length/v**(k/2)};
const med=a=>{const b=[...a].sort((x,y)=>x-y),n=b.length;return n%2?b[(n-1)/2]:(b[n/2-1]+b[n/2])/2};
const corr=(x,y)=>{const mx=mean(x),my=mean(y);let a=0,b=0,c=0;for(let i=0;i<x.length;i++){a+=(x[i]-mx)*(y[i]-my);b+=(x[i]-mx)**2;c+=(y[i]-my)**2}return a/Math.sqrt(b*c)};
const acf=(x,L)=>{const m=mean(x),d=x.reduce((s,v)=>s+(v-m)**2,0);return Array.from({length:L},(_,k)=>{let s=0;for(let t=k+1;t<x.length;t++)s+=(x[t]-m)*(x[t-k-1]-m);return s/d})};
const lbQ=(r,L)=>{const n=r.length;return n*(n+2)*r.slice(0,L).reduce((s,v,k)=>s+v*v/(n-k-1),0)};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3200)};
const inEv=d=>EV.some(e=>e[0]<=d&&d<=e[1]);
const freq=a=>{if(a.length<3)return'Other';const t=a.map(x=>Date.parse(x[0]));const g=[];for(let i=1;i<t.length;i++)g.push((t[i]-t[i-1])/864e5);const m=med(g);return m<=3?'Daily':m<=8?'Weekly':m<=35?'Monthly':'Other'};
const ret=(a,tf)=>{const o=[];for(let i=1;i<a.length;i++){const p=a[i-1][1],v=a[i][1];if(tf=='logret'){if(p>0&&v>0)o.push([a[i][0],Math.log(v/p)])}else o.push([a[i][0],v-p])}return o};
const R=n=>REG.find(r=>r.n==n);
function down(name,text,mime='text/plain'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;a.click()}

/* ============ DATA LOADING: backup file → live fetch → uploads ============ */
const PROX=[u=>u,u=>'https://corsproxy.io/?'+encodeURIComponent(u),u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u)];
async function getU(u){for(const p of PROX){try{const r=await fetch(p(u));if(r.ok)return r}catch(e){}}throw new Error('blocked')}
function parseCSV(t){const o=[];for(const l of t.trim().split(/\r?\n/).slice(1)){const [d,v]=l.split(',');const x=parseFloat(v);if(d&&isFinite(x))o.push([d.trim().slice(0,10),x])}return o}
function ingest(obj,tag){let n=0;for(const k in obj){const v=obj[k];const a=Array.isArray(v)?v:v.d.map((d,i)=>[d,v.v[i]]);S.raw[k]=a.filter(x=>x[1]!=null);S.src[k]=tag;n++}return n}
async function loadBackup(quiet){try{const r=await fetch('backup_data.json',{cache:'no-store'});if(!r.ok)throw 0;const n=ingest(await r.json(),'backup');if(!quiet)toast(`Backup loaded: ${n} series`);return true}catch(e){if(!quiet)toast('backup_data.json not found next to index.html — see README');return false}}
async function liveFetch(){const b=$('#lf');b.disabled=true;let ok=0,bad=[];const p1=Math.floor(Date.parse(CFG.start)/1e3),p2=Math.floor(Date.parse(CFG.end)/1e3);
 for(const r of REG.filter(r=>r.on)){b.textContent=`Fetching ${r.n}…`;try{
  if(r.s.startsWith('FRED')){const t=await(await getU(`https://fred.stlouisfed.org/graph/fredgraph.csv?id=${r.code}&cosd=${CFG.start}&coed=${CFG.end}`)).text();const a=parseCSV(t);if(a.length<10)throw 0;S.raw[r.n]=a}
  else if(r.s=='Yahoo'){const j=await(await getU(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(r.code)}?period1=${p1}&period2=${p2}&interval=1d`)).json();const c=j.chart.result[0],q=ADJ.has(r.n)?c.indicators.adjclose[0].adjclose:c.indicators.quote[0].close;S.raw[r.n]=c.timestamp.map((t,i)=>[new Date(t*1e3).toISOString().slice(0,10),q[i]]).filter(x=>x[1]!=null)}
  else throw 0;S.src[r.n]='live';ok++}catch(e){bad.push(r.n)}}
 b.disabled=false;b.textContent='⚡ Live fetch';toast(`Live: ${ok} ok · ${bad.length} need backup/upload (${bad.slice(0,6).join(', ')})`);render()}
async function onUpload(files){let n=0;for(const fl of files){const t=await fl.text();if(fl.name.endsWith('.json')){n+=ingest(JSON.parse(t),'upload')}else{const nm=fl.name.replace(/\.[^.]+$/,'');const r=REG.find(x=>x.n.toLowerCase()==nm.toLowerCase());if(!r)REG.push({n:nm,o:'Custom',c:'Custom',s:'Upload',code:fl.name,u:'',tf:'logret',d:'User-uploaded series',on:true});const key=r?r.n:nm;S.raw[key]=parseCSV(t);S.src[key]='upload';n++}}toast(`${n} series uploaded`);render()}

/* ============ CLEANING PIPELINE (Steps 5–6) ============ */
function hampel(a,tf){const y=a.filter(x=>isFinite(x[1])&&(tf!='logret'||x[1]>0)).map(x=>[x[0],tf=='logret'?Math.log(x[1]):x[1]]),w=CFG.win,h=w>>1,res=[];
 for(let i=0;i<y.length;i++){const lo=Math.max(0,i-h),hi=Math.min(y.length,i+h+1);res.push(y[i][1]-med(y.slice(lo,hi).map(z=>z[1])))}
 let sc=1.4826*med(res.map(Math.abs));if(!sc)sc=sd(res);const F=new Set();res.forEach((v,i)=>{if(i>=h&&i<y.length-h&&Math.abs(v)/sc>CFG.k)F.add(y[i][0])});return F}
function runClean(){S.log=[];S.clean={};const L=(s,d,v,act,why,st)=>S.log.push({s,d,v,act,why,st}),pre={},fl={};const act=REG.filter(r=>r.on&&S.raw[r.n]);
 for(const r of act){const m=new Map();for(const[d,v]of S.raw[r.n]){if(d<CFG.start||d>CFG.end||!isFinite(v))continue;if(m.has(d))L(r.n,d,v,'removed','duplicate timestamp (kept last)','5B');m.set(d,v)}
  pre[r.n]=[...m].sort((x,y)=>x[0]<y[0]?-1:1).map(([d,v])=>{if(r.tf=='logret'&&v<=0){L(r.n,d,v,'set to NaN','non-positive value in strictly positive series','5B');return[d,NaN]}return[d,v]});fl[r.n]=hampel(pre[r.n],r.tf)}
 const peer={WTI:'Brent',Brent:'WTI'};
 for(const r of act){let a=pre[r.n].map(([d,v])=>{if(!fl[r.n].has(d))return[d,v];const why=inEv(d)?'inside event window':r.s=='Yahoo'?'exchange-quoted price':(peer[r.n]&&fl[peer[r.n]]?.has(d))?'confirmed by peer benchmark':null;
   if(why){L(r.n,d,v,'retained','genuine shock: '+why,'5A');return[d,v]}L(r.n,d,v,'set to NaN','isolated spike, outside events, unconfirmed','5A');return[d,NaN]});
  const lim=({Daily:CFG.gD,Weekly:CFG.gW,Monthly:CFG.gM}[freq(a.filter(x=>isFinite(x[1])))])||2,out=[];let ni=0,i=0;
  while(i<a.length){if(isFinite(a[i][1])){out.push(a[i]);i++;continue}let j=i;while(j<a.length&&!isFinite(a[j][1]))j++;
   if(i>0&&j<a.length&&j-i<=lim){for(let k=i;k<j;k++){out.push([a[k][0],a[i-1][1]+(a[j][1]-a[i-1][1])*(k-i+1)/(j-i+1)]);ni++}}i=j}
  if(ni)L(r.n,'—',ni,'interpolated',`gaps ≤ ${lim} obs, linear by position`,'5C');S.clean[r.n]=out}}

V.model=()=>`<h2>Model primer &amp; Algorithm 1</h2><p class="lead" style="margin:6px 0 20px">The illustrative DAG below is assumed from domain knowledge, not learned. Click a node to reveal its Markov blanket: parents, children and co-parents.</p>
<div class="card"><div class="row"><span class="chip" style="color:var(--a);border-color:var(--a)">target</span><span class="chip" style="color:var(--b);border-color:var(--b)">parent</span><span class="chip" style="color:var(--c);border-color:var(--c)">child</span><span class="chip" style="color:var(--g);border-color:var(--g)">spouse</span><span class="mono" id="mbt" style="margin-left:auto"></span></div><div style="overflow:auto"><svg id="dag" viewBox="0 0 780 390" style="min-width:640px;width:100%"></svg></div></div>
<div class="card"><h3>Algorithm 1 · Inferred causality (group draft pseudocode)</h3><pre>Input : data D (stationary, discretised), target T = WTI, candidates V, level α, max conditioning size m
Output: DAG G, Markov blanket MB(T)

 1  G ← complete undirected graph over V ∪ {T}
 2  for ℓ = 0 … m:
 3      for each edge (X,Y) in G with |adj(X)\\{Y}| ≥ ℓ:
 4          for each Z ⊆ adj(X)\\{Y} with |Z| = ℓ:
 5              if X ⊥ Y | Z at level α:  delete edge (X,Y); sepset(X,Y) ← Z; break
 6  for each X – Z – Y with X,Y non-adjacent and Z ∉ sepset(X,Y):  orient X → Z ← Y     (v-structures)
 7  propagate orientations (no new v-structures, no cycles)
 8  MB(T) ← parents(T) ∪ children(T) ∪ spouses(T)
 9  V ← MB(T);  estimate CPTs for G[V] by Bayesian parameter learning (Dirichlet α = 1)
10  return G[V], MB(T)</pre><p class="mono" style="color:var(--mu);margin-top:10px">Draft for the write-up: align the wording with Algorithm 1 in Alvi (2018) before submitting.</p></div>`;

 DAG.forEach(([a,b])=>{const A=POS[a],B=POS[b],dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),x2=B[0]-dx/L*30,y2=B[1]-dy/L*30,hl=(a==SEL||b==SEL||(Sp.includes(a)&&C.includes(b)));h+=`<line class="ed ${hl?'h':''}" x1="${A[0]+dx/L*30}" y1="${A[1]+dy/L*30}" x2="${x2}" y2="${y2}"/><circle cx="${x2}" cy="${y2}" r="3" fill="${hl?css('--a'):css('--mu')}"/>`});
 Object.keys(POS).forEach(n=>{const k=n==SEL?'t':P.includes(n)?'p':C.includes(n)?'k':Sp.includes(n)?'s':'';h+=`<g class="nd ${k}" data-n="${n}"><circle cx="${POS[n][0]}" cy="${POS[n][1]}" r="30"/><text x="${POS[n][0]}" y="${POS[n][1]+4}" text-anchor="middle">${n.length>9?n.slice(0,8)+'…':n}</text></g>`});
 g.innerHTML=h;$('#mbt').textContent=`MB(${SEL}) = {${[...P,...C,...Sp].join(', ')||'∅'}}`;g.querySelectorAll('.nd').forEach(e=>e.onclick=()=>{SEL=e.dataset.n;drawDag()})}

/* ============ ROUTER / THEME ============ */
function render(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k==TAB?'on':''}" data-t="${k}">${l}</button>`).join('');
 document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render();scrollTo({top:0,behavior:'smooth'})});
 if(['clean','eda','facts'].includes(TAB))runClean();$('#view').innerHTML=V[TAB]();
 ({data:wireData,clean:drawClean,eda:drawEda,facts:drawFacts,model:drawDag})[TAB]?.()}
$('#th').onclick=()=>{const d=document.documentElement,l=d.dataset.theme=='dark';d.dataset.theme=l?'light':'dark';$('#th').textContent=l?'☀':'☾';render()};
(async()=>{render();await loadBackup(true);if(Object.keys(S.raw).length){toast(`Backup data loaded: ${Object.keys(S.raw).length} series`);render()}})();
</script>
